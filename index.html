
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ボス必要攻撃回数チェッカー</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 16px;
      line-height: 1.6;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
    }

    .table-wrapper {
      overflow-x: auto;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 520px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: right;
      font-size: 0.9rem;
    }

    th {
      background: #f0f0f0;
      text-align: left;
    }

    .danger {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>ボス必要攻撃回数チェッカー</h1>

  <label for="atk">自分の攻撃力：</label>
  <input type="number" id="atk" min="1" value="100">
  <button id="calcBtn">確認</button>

  <div class="table-wrapper">
    <table id="resultTable">
      <thead>
        <tr>
          <th>敵名（レベル）</th>
          <th>ボスHP</th>
          <th>必要攻撃数</th>
          <th>15%削る攻撃数</th>
          <th>その時の削り割合(%)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const bosses = [
      { level: 1, name: "スライムキング", hp: 300 },
      { level: 2, name: "ファングウルフ", hp: 550 },
      { level: 3, name: "炎のゴーレム", hp: 900 },
      { level: 4, name: "古代ドラゴン", hp: 1500 },
      { level: 5, name: "深淵の魔王", hp: 2500 }
    ];

    const atkInput = document.getElementById('atk');
    const calcBtn = document.getElementById('calcBtn');
    const tbody = document.querySelector('#resultTable tbody');

    function calcHits(hp, atk) {
      return Math.ceil(hp / atk);
    }

    function calc15Hits(hp, atk) {
      const target = hp * 0.15;
      return Math.ceil(target / atk);
    }

    function calcPercent(hp, atk, hits) {
      return ((atk * hits) / hp * 100).toFixed(1);
    }

    function renderTable() {
      const atk = Number(atkInput.value);
      tbody.innerHTML = '';

      bosses.forEach(boss => {
        const needHits = calcHits(boss.hp, atk);
        const hits15 = calc15Hits(boss.hp, atk);
        const percent15 = calcPercent(boss.hp, atk, hits15);

        const tr = document.createElement('tr');

        tr.innerHTML = `
          <td style="text-align:left;">${boss.name}（Lv.${boss.level}）</td>
          <td>${boss.hp}</td>
          <td class="${needHits >= 9 ? 'danger' : ''}">${needHits}</td>
          <td>${hits15}</td>
          <td>${percent15}%</td>
        `;

        tbody.appendChild(tr);
      });
    }

    calcBtn.addEventListener('click', renderTable);
    renderTable();
  </script>
</body>
</html>
