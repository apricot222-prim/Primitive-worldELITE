const atkInput = document.getElementById('atk');
const startLevel = document.getElementById('startLevel');
const endLevel = document.getElementById('endLevel');
const calcBtn = document.getElementById('calcBtn');
const tbody = document.querySelector('#resultTable tbody');

function fillLevelSelect() {
  for (let i = 1; i <= bosses.length; i++) {
    const opt1 = document.createElement('option');
    opt1.value = i;
    opt1.textContent = i;
    startLevel.appendChild(opt1);

    const opt2 = document.createElement('option');
    opt2.value = i;
    opt2.textContent = i;
    endLevel.appendChild(opt2);
  }
  endLevel.value = bosses.length;
}

fillLevelSelect();

function calcHits(hp, atk) {
  return Math.ceil(hp / atk);
}

function calc15Hits(hp, atk) {
  return Math.ceil((hp * 0.15) / atk);
}

function calcPercent(hp, atk, hits) {
  return ((atk * hits) / hp * 100).toFixed(1);
}

function renderTable() {
  const atk = Number(atkInput.value);
  const s = Number(startLevel.value);
  const e = Number(endLevel.value);

  tbody.innerHTML = '';

  bosses
    .filter(b => b.level >= s && b.level <= e)
    .forEach(boss => {
      const needHits = calcHits(boss.hp, atk);
      const hits15 = calc15Hits(boss.hp, atk);
      const percent15 = calcPercent(boss.hp, atk, hits15);

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="text-align:left;">${boss.name}（Lv.${boss.level}）</td>
        <td>${boss.hp}</td>
        <td class="${needHits >= 9 ? 'danger' : ''}">${needHits}</td>
        <td>${hits15}</td>
        <td>${percent15}%</td>
      `;
      tbody.appendChild(tr);
    });
}

calcBtn.addEventListener('click', renderTable);
renderTable();
