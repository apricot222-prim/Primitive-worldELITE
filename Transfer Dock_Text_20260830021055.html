
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ボス必要攻撃回数チェッカー</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 16px;
      line-height: 1.6;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
    }

    /* テーブルをスマホで横スクロール可能に */
    .table-wrapper {
      overflow-x: auto;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 300px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: right;
      font-size: 0.9rem;
    }

    th {
      background: #f0f0f0;
      text-align: left;
    }
  </style>
</head>
<body>
  <h1>ボス必要攻撃回数チェッカー</h1>

  <label for="atk">自分の攻撃力：</label>
  <input type="number" id="atk" min="1" value="100">
  <button id="calcBtn">確認</button>

  <div class="table-wrapper">
    <table id="resultTable">
      <thead>
        <tr>
          <th>レベル</th>
          <th>ボスHP</th>
          <th>必要攻撃回数</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const bosses = [
      { level: 1, hp: 300 },
      { level: 2, hp: 550 },
      { level: 3, hp: 900 },
      { level: 4, hp: 1500 },
      { level: 5, hp: 2500 }
    ];

    const atkInput = document.getElementById('atk');
    const calcBtn = document.getElementById('calcBtn');
    const tbody = document.querySelector('#resultTable tbody');

    function calcHits(hp, atk) {
      return Math.ceil(hp / atk);
    }

    function renderTable() {
      const atk = Number(atkInput.value);
      tbody.innerHTML = '';

      bosses.forEach(boss => {
        const tr = document.createElement('tr');

        tr.innerHTML = `
          <td style="text-align:left;">Lv.${boss.level}</td>
          <td>${boss.hp}</td>
          <td>${calcHits(boss.hp, atk)}</td>
        `;

        tbody.appendChild(tr);
      });
    }

    calcBtn.addEventListener('click', renderTable);
    renderTable();
  </script>
</body>
</html>
